ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.3
    two_d_mode: true  #####
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # use X & Y position, forward (X) velocity, and yaw from odometry
    # This corresponds with hardware state interfaces and nav_msgs/msg/Odometry
    odom0: diff_drive_controller/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true, true, false,
                   false, false, true,
                   false, false, false]

    imu0: imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  true, false, false]
    imu0_remove_gravitational_acceleration: false