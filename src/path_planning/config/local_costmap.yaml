local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      robot_radius: 0.16
      update_frequency: 5.0
      publish_frequency: 3.0
      global_frame: odom
      robot_base_frame: base_link
      always_send_full_costmap: true
      # specifies the area centered around the robot that will define the costmap
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05 # This can be a higher resolution since it is a small area

      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          expected_update_rate: 5.5
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
      # inflation layer: adds padding around obstacles but will go near them if it has to
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.4